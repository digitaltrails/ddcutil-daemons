[package]
name = "ddc-ci-varlink"
version = "0.1.0"
edition = "2021"

[dependencies]
varlink = "13"
log = "0.4"
env_logger = "0.11"
base64 = "0.21"
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0.151"
rustix = { version = "1.1.4", features = ["process"] }
crossbeam-channel = "0.5.16"
ddcutil-backend = { path = "../ddcutil-backend" }

# We'll use std::thread for blocking calls – no tokio needed for the main loop.

[build-dependencies]
varlink_generator = "13"
